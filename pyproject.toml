# football-ai-training — el repo donde se entrena.
#
# `torch` vive aqui y esta prohibido en el repo de deteccion, donde lo verifica
# `.importlinter`. Lo que cruza la frontera son, por modelo, un `.onnx`, un
# `.mlpackage.zip`, su ficha y su bundle dorado (ADR 0002).

[project]
name = "football-ai-training"
version = "0.1.0"
description = "Entrenamiento y export de los modelos de football-ai, a ONNX y a Core ML."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = []

[dependency-groups]

# core — herramientas. Se instala siempre y no baja gigabytes.
core = [
    "numpy>=2.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxsim>=0.4",
    # Descargar etiquetas no necesita torch: el paquete va en core para que T2 se pueda
    # correr sin bajarse el grupo de entrenamiento entero.
    "SoccerNet>=0.1.56",
]

# train — opt-in: uv sync --group train. Varios GB y quiere GPU.
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    # Desde torch 2.6 `torch.onnx.export` lo importa siempre, use o no el exportador
    # nuevo. Sin el, exportar muere con un ModuleNotFoundError.
    "onnxscript>=0.1",
    "timm>=1.0",
    "opencv-python-headless>=4.10",
    "tensorboard>=2.18",
    # Lo que importa DEIM (ML-15, tools/fetch_deim.py). transformers no lo importa el
    # codigo de DEIM, pero si calflops AL IMPORTARSE (engine.misc -> profiler_utils ->
    # calflops -> transformers), asi que sin el no se puede ni construir el modelo (ML-16).
    "faster-coco-eval>=1.6.5",
    "scipy>=1.14",
    "calflops>=0.3",
    "transformers>=4.44",
]

# apple — opt-in: uv sync --group train --group apple. Export a Core ML (ML-05). En Linux
# convierte; en el Mac ademas predice. No hay ruedas para Windows: ahi el grupo no instala
# nada y los tests de Core ML se saltan.
apple = [
    "coremltools>=9 ; sys_platform != 'win32'",
]

# ref — opt-in: uv sync --group ref. La referencia Python de football-ai (ML-03), fijada
# por commit en [tool.uv.sources]: moverla es cambiar ese sha, y no hay otro modo. Aquel
# paquete no declara su runtime (vive en un grupo de su repo), asi que aqui van las
# dependencias de los modulos que usa `ftrain/ref.py`: scipy (postproceso) y opencv (campo
# y franja). numpy y pyyaml ya vienen en core.
ref = [
    "football-ai",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
]

# data — opt-in: uv sync --group data. La verificacion de grabaciones (ML-07) abre los
# .mov con PyAV. La rueda empaqueta un FFmpeg con partes GPL: aqui solo DECODIFICA y la
# herramienta es interna, no se distribuye (docs/DEPENDENCIES.md).
data = [
    "av>=12",
]

dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["core", "dev"]

[tool.uv.sources]
football-ai = { git = "https://github.com/jhquihuiri7/fooball_ai_streaming", rev = "efed47bb765fd36a3b24a597db13ef47447975bb" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Los cuadernos se revisan igual con el linter, pero no se formatean: el formateador
# parte cada argumento de una orden en su propia linea, y una celda de doce lineas para
# un `git clone` no la lee nadie. En un cuaderno la legibilidad la pone quien lo escribe.
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # los docstrings se escriben en prosa, no con un formato impuesto
    "ANN401",  # `Any` es legitimo al leer YAML y salidas de terceros
    "COM812",  # lo gestiona el formateador
    "CPY001",  # no se pone cabecera de copyright en cada fichero
    "INP001",  # `tools/` y `tests/` son carpetas sueltas, no paquetes instalables
    "S105",    # el nombre de una variable de entorno no es una contrasena
    "S603",    # subprocess con lista de argumentos, que es la forma segura
    "S607",    # `git` desde el PATH: es lo que hay en cualquier maquina de desarrollo
]

[tool.ruff.lint.per-file-ignores]
# `ftrain/` es una libreria y no imprime; las herramientas de linea de comandos si.
"tools/*" = ["T201"]
"tests/*" = ["S101", "PLR2004", "ANN"]
# Un notebook de Colab se lee y se ejecuta a mano, y sus celdas mezclan Python con magias
# de shell. Anotar tipos, abrir con `Path.open` o partir una linea de ffmpeg en dos no lo
# mejora: lo hace mas dificil de leer, que es justo lo contrario de para lo que existe.
"notebooks/*.ipynb" = [
    "ANN",      # anotar tipos en un cuaderno no ayuda a leerlo
    "E402",     # las celdas importan donde toca contarlo, no al principio del fichero
    "E501",     # las magias de shell no se parten en dos
    "EM102",    # un `raise` con su mensaje dentro se lee mejor en una celda
    "ERA001",   # hay lineas comentadas a proposito: son las alternativas a elegir
    "F401",     # se importa para comprobar que esta instalado, no para usarlo
    "I001",
    "PLC0207",
    "PTH123",
    "SIM115",
    "T201",     # un cuaderno ensena lo que pasa imprimiendolo
    "TRY003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin esto `tools` no se importa: no hay paquete instalable, son herramientas sueltas.
pythonpath = ["."]
