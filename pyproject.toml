# football-ai-training — el repo donde se entrena.
#
# `torch` vive aqui y esta prohibido en el repo de deteccion, donde lo verifica
# `.importlinter`. Lo unico que cruza la frontera es un `.onnx` con su ficha.

[project]
name = "football-ai-training"
version = "0.1.0"
description = "Entrenamiento y export de los modelos de football-ai. Produce .onnx con su ficha."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = []

[dependency-groups]

# core — herramientas. Se instala siempre y no baja gigabytes.
core = [
    "numpy>=2.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    # Descargar etiquetas no necesita torch: el paquete va en core para que T2 se pueda
    # correr sin bajarse el grupo de entrenamiento entero.
    "SoccerNet>=0.1.56",
]

# train — opt-in: uv sync --group train. Varios GB y quiere GPU.
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "opencv-python-headless>=4.10",
    "tensorboard>=2.18",
]

dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["core", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # los docstrings se escriben en prosa, no con un formato impuesto
    "ANN401",  # `Any` es legitimo al leer YAML y salidas de terceros
    "COM812",  # lo gestiona el formateador
    "CPY001",  # no se pone cabecera de copyright en cada fichero
    "INP001",  # `tools/` y `tests/` son carpetas sueltas, no paquetes instalables
    "S105",    # el nombre de una variable de entorno no es una contrasena
    "S603",    # subprocess con lista de argumentos, que es la forma segura
    "S607",    # `git` desde el PATH: es lo que hay en cualquier maquina de desarrollo
    "T201",    # las herramientas de linea de comandos imprimen
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin esto `tools` no se importa: no hay paquete instalable, son herramientas sueltas.
pythonpath = ["."]
